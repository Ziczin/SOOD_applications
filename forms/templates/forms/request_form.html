<form method="post">
    {% csrf_token %}
    <script>console.log(`{{form}}`)</script>
    {{ form.as_custom }}
    <button type="submit" class="confirm"> {{ form.btn_confirm }} </button>
</form>
<div class="mt-10">
    <a href="{{ form.sub_btn_link }}"
    class="sub_btn_act"
    >{{ form.sub_btn_link_text }}</a>
</div>
{% if errors %}
    <div class="errors">
        {% for error in errors %}
            <p style='color: red;'>{{ error }}</p>
        {% endfor %}
    </div>
{% endif %}
