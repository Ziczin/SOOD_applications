<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>




<script>
    // CONFIG
    const css = {
        bs: {
            card: 'card',
            cardHeader: 'card-header',
            cardBody: 'card-body',
            btn: 'btn',
            btnLink: 'btn-link',
            collapse: 'collapse',
            show: 'show',
            collapsed: 'collapsed',
            btnPrimary: 'btn-primary',
            formControl: 'form-control',
            btnDanger: 'btn-danger',
            btnWarning: 'btn-warning',
            btnSm: 'btn-sm',
            disabled: 'disabled',
        },
        custom: {
            accordion: 'accordion',
            fieldItem: 'field-item',
            addButton: 'add-field-btn',
            formHeader: 'form-header',
            fieldsHeader: 'fields-header',
            fieldsContainer: 'fields-container',
            fieldsSection: 'fields-section',
            fieldControls: 'field-controls',
            disabledField: 'disabled-field',
            servicesHeader: 'services-header',
            serviceAvailable: 'service-available',
            serviceUnavailable: 'service-unavailable',
            servicesControls: 'services-controls',
            groupControls: 'group-controls',
            disabledGroup: 'disabled-group',
            mainMargin: 'main-margin',
        },
        other: {
            formGroup: 'form-group',
            flexRow: 'flex-row',
            flexColumn: 'flex-column',
            gap6px: 'gap-6px',
            marginOnHover: 'margin-on-hover',
            recolorOnHover: 'recolor-on-hover',
            shady: 'shady',
        },
        attr: {
            formHeader: 'data-form-header',
            fieldsHeader: 'data-fields-header',
            servicesHeader: 'data-services-header',
            innerHeader: 'data-inner-header',
            addCardButton: 'data-add-card-button',
            toggleCardButton: 'data-toggle-card-button',
            deleteCardButton: 'data-delete-card-button',
            manageButton: 'data-manage-button',
        }
    };

    const data = {
        form: {
            confirm_button_text: "Confirm Button Text",
            form_label: "Testovaya Forma",
            page_label: "Test"
        },
        fields: [
            { label: "Количество", selected_type: "Int", isInitial: true, disabled: false },
            { label: "Цена", selected_type: "Float", isInitial: true, disabled: false },
            { label: "Наименование", selected_type: "Str", isInitial: true, disabled: false },
            { label: "Описание", selected_type: "Str", isInitial: true, disabled: false }
        ],
        service_groups: {
            available: {
                group1: {
                    name: "Группа сервисов 1",
                    services: [
                        { name: "Сервис 1.1", available: true },
                        { name: "Сервис 1.2", available: false },
                        { name: "Сервис 1.3", available: true }
                    ],
                    disabled: false
                },
                group2: {
                    name: "Группа сервисов 2",
                    services: [
                        { name: "Сервис 2.1", available: false },
                        { name: "Сервис 2.2", available: true }
                    ],
                    disabled: false
                },
                group3: {
                    name: "Группа сервисов 3",
                    services: [
                        { name: "Сервис 3.1", available: true },
                        { name: "Сервис 3.2", available: true },
                        { name: "Сервис 3.3", available: false }
                    ],
                    disabled: false
                },
                group4: {
                    name: "Группа сервисов 4",
                    services: [
                        { name: "Сервис 4.1", available: false }
                    ],
                    disabled: false
                },
                group5: {
                    name: "Группа сервисов 5",
                    services: [
                        { name: "Сервис 5.1", available: true },
                        { name: "Сервис 5.2", available: true }
                    ],
                    disabled: false
                },
                group6: {
                    name: "Группа сервисов 6",
                    services: [
                        { name: "Сервис 6.1", available: false },
                        { name: "Сервис 6.2", available: false }
                    ],
                    disabled: false
                }
            },
            selected: ['group2', 'group5']
        }
    };

    // myMAKE
    function withCss(...classes) {
        return (element) => {
            classes.forEach(cls => cls && element.classList.add(cls));
            return element;
        }
    }

    function withText(text) {
        return (element) => {
            element.textContent = text;
            return element;
        }
    }

    function withParamAttributes(attributes) {
        return (element) => {
            Object.entries(attributes).forEach(([key, value]) => {
                element.setAttribute(key, value);
            });
            return element;
        };
    }

    function withValue(value) {
        return (element) => {
            element.setAttribute('value', value);
        };
    }

    function withAttributes(...attributes) {
        return (element) => {
            attributes.forEach((attr) => {
                element.setAttribute(attr, '');
            });
            return element;
        };
    }

    function withClickHandler(handler) {
        return (element) => {
            element.addEventListener('click', handler);
            return element;
        };
    }

    function withChilds(...childs) {
        return (element) => {
            childs.forEach(child => {
                if (child != undefined) {
                    element.appendChild(child);
                }
            });
            return element;
        };
    }

    function makeElement(elementType, ...decorators) {
        const element = document.createElement(elementType);
        return decorators.reduce((el, decorator) => decorator(el) || el, element);
    }

    function Label(forWhat, text, ...decorators) {
        return makeElement(
            'label', withText(text),
            withParamAttributes({for: forWhat}),
            ...decorators
        );
    }

    function Input(name, placeholder, ...decorators) {
        return makeElement(
            'input',
            withParamAttributes({
                name: name,
                placeholder: placeholder,
            }),
            ...decorators
        );
    }

    function Div(...decorators) {
        return makeElement('div', ...decorators);
    }

    function makeIf(condition, elem) {
        if (condition) {
            return elem;
        }
    }

    function makeItGapped(elem) {
        elem.classList.add(css.other.gap6px);
        return elem;
    }

    function makeItFlexRow(elem) {
        elem.classList.add(css.other.flexRow);
        return elem;
    }

    function makeItFlexColumn(elem) {
        elem.classList.add(css.other.flexColumn);
        return elem;
    }

    function makeItFormGroup(div) {
        div.classList.add(css.other.formGroup);
        div.classList.add(css.other.shady);
        div.classList.add(css.other.marginOnHover);
        div.classList.add(css.other.recolorOnHover);
        return div;
    }

    function makeItCard(card) {
        card.classList.add(css.bs.card);
        return card;
    }

    function makeItHeader(header) {
        header.classList.add(css.bs.cardHeader);
        header.style.display = 'flex';
        header.style.justifyContent = 'space-between';
        header.style.alignItems = 'center';
        return header;
    }

    function makeItBody(body) {
        body.classList.add(css.bs.cardBody);
        return body;
    }

    function makeButton(...decorators) {
        return makeElement(
            'button',
            withParamAttributes({type: 'button'}),
            ...decorators);
    }

    function makeItWarning(btn) {
        btn.classList.add(css.bs.btn, css.bs.btnWarning, css.bs.btnSm);
        return btn;
    }

    function makeItDanger(btn) {
        btn.classList.add(css.bs.btn, css.bs.btnDanger, css.bs.btnSm);
        return btn;
    }

    function makeItLink(btn) {
        btn.classList.add(css.bs.btn, css.bs.btnLink);
        return btn;
    }

    function Select(...decorators) {
        return makeElement('select', ...decorators);
    }

    function Paragraph(...decorators) {
        return makeElement('p', ...decorators);
    }

    // COMPONENTS
    function createAccordionItem(
        {
            id, 
            title, 
            content, 
            isOpen = false, 
            controls = null,
            additionalClasses = [], 
            additionalAttributes = [],
            additionalParamAttributes = {}
        }
    ) {
        const card = Div(
            makeItCard,
            withCss(...additionalClasses),
            withAttributes(...additionalAttributes),
            withParamAttributes(additionalParamAttributes),
        );
        
        const header = Div(makeItHeader);
        const button = makeButton(
            withCss(isOpen ? '' : css.bs.collapsed),
            withText(title),
            withParamAttributes({
                'data-toggle': 'collapse',
                'data-target': `#${id}`,
                'aria-expanded': isOpen,
                'style': 'flex-grow: 1; text-align: left;',
                'data-header-toggler': '',
            })
        );
        header.appendChild(button);
        
        if (controls) header.appendChild(controls);

        const collapse = createCollapseSection(id, isOpen);
        collapse.appendChild(createCardBody(content));

        card.appendChild(header);
        card.appendChild(collapse);
        return card;
    }

    function createCollapseSection(id, isShow = false) {
        const collapse = Div(
            withCss(css.bs.collapse),
            withCss(isShow ? css.bs.show : '')
        );
        collapse.id = id;
        return collapse;
    }

    function createCardBody(content) {
        const body = Div(withCss(css.bs.cardBody));
        
        if (typeof content === 'string') {
            body.appendChild(document.createTextNode(content));
        } else {
            body.appendChild(content);
        }
        
        return body;
    }

    function createServiceItem(service) {
        const item = Div(withText(service.name));
        item.className = service.available 
            ? css.custom.serviceAvailable 
            : css.custom.serviceUnavailable;
        return item;
    }

    // FORM_RENDERERS
    function renderFormSection(formData, container) {
        const card = createAccordionItem({
            id: 'formPanel',
            title: 'Форма',
            content: Div(makeItFlexColumn, makeItGapped, 
                withChilds(
                    Div(makeItFormGroup,
                    withChilds(
                        Label('form-name', 'Название формы:'),
                        Input('form-name', 'Введите имя формы',
                            withValue(`${formData.form_label}`),
                    ))),
                    Div(makeItFormGroup,
                    withChilds(
                        Label('form-button-text', 'Текст кнопки подтверждения:'),
                        Input('form-button-text', 'Введите текст',
                            withValue(`${formData.confirm_button_text}`),
                    ))),
                    Div(makeItFormGroup,
                    withChilds(
                        Label('form-page', 'Наименование страницы:'),
                        Input('form-page', 'Введите текст',
                            withValue(`${formData.page_label}`),
                    ))),
                ),
            ),
            additionalAttributes: [css.attr.formHeader],
        });
        container.appendChild(card);
    }

    // FIELDS_RENDERERS
    function createFieldControls(fieldData) {
        return Div(
            withCss(css.custom.fieldControls),
            withChilds(
                makeButton(
                makeItWarning,
                withText(fieldData.disabled ? 'Включить' : 'Отключить'),
                withClickHandler(event => toggleFieldDisabled(event, fieldData)),
                withAttributes(css.attr.toggleCardButton, css.attr.manageButton)
                ),
                makeIf(!fieldData.isInitial,
                    makeButton(
                    makeItDanger, 
                    withText('Удалить'),
                    withClickHandler(event => deleteField(event, fieldData)),
                    withAttributes(css.attr.deleteCardButton, css.attr.manageButton)
                    )
                )
            )
        )
    }

    function toggleFieldDisabled(event, fieldData) {
        event.stopPropagation();
        fieldData.disabled = !fieldData.disabled;
        event.target.textContent = fieldData.disabled ? 'Включить' : 'Отключить';
        event.target.closest('.card').classList.toggle(css.custom.disabledField, fieldData.disabled);
    }

    function deleteField(event, fieldData) {
        event.stopPropagation();
        const fieldIndex = data.fields.findIndex(field => 
            field.label === fieldData.label && 
            field.selected_type === fieldData.selected_type
        );
        if (fieldIndex !== -1) data.fields.splice(fieldIndex, 1);
        event.target.closest('.card').remove();
    }

    function renderFieldItem(field, index, openStates) {
        return createAccordionItem({
            id: `field${index}`,
            title: `Поле ${index + 1}: ${field.label}`,
            content: `Тип: ${field.selected_type}`,
            isOpen: openStates[`field${index}`],
            controls: createFieldControls(field),
            additionalClasses: [
                css.custom.fieldItem,
                field.disabled ? css.custom.disabledField : ''
            ],
            additionalAttributes: [css.attr.innerHeader]
        });
    }

    function renderFieldsContent(fields, container) {
        const openStates = getOpenStates(container);
        container.innerHTML = '';
        
        fields.forEach((field, index) => {
            container.appendChild(renderFieldItem(field, index, openStates));
        });
    }

    function renderFieldsSection(fields, container) {
        const card = createAccordionItem({
            id: 'fieldsPanel',
            title: 'Поля',
            content: (() => {
                const body = Div(makeItFlexColumn, makeItGapped);
                const fieldsContainer = Div(makeItFlexColumn, makeItGapped,
                    withCss(
                        css.custom.fieldsContainer,
                        css.custom.fieldsSection,
                    )
                );
                
                renderFieldsContent(fields, fieldsContainer);
                
                const addButton = makeButton(
                    withCss(css.bs.btn, css.bs.btnPrimary, css.custom.addButton),
                    withText('Добавить поле'),
                    withClickHandler(event => {
                        event.stopPropagation();
                        data.fields.push({
                            label: "Новое поле " + (data.fields.filter(f => !f.isInitial).length + 1),
                            selected_type: "Str",
                            isInitial: false,
                            disabled: false
                        });
                        renderFieldsContent(data.fields, document.querySelector('.fields-section'));
                    }),
                    withAttributes(css.attr.addCardButton, css.attr.manageButton),
                );
                
                body.appendChild(fieldsContainer);
                body.appendChild(addButton);
                return body;
            })(),
            additionalAttributes: [css.attr.fieldsHeader],
        });
        container.appendChild(card);
    }

    // SERVICES_RENDERERS
    function createServiceGroupControls(group, groupId, serviceGroups) {
        const controls = Div(withCss(css.custom.groupControls));
        controls.style.display = 'flex';
        controls.style.gap = '5px';

        const disableBtn = makeButton(
            makeItWarning,
            withText(group.disabled ? 'Включить' : 'Отключить'),
            withClickHandler(event => toggleGroupDisabled(event, group, serviceGroups)),
            withAttributes(css.attr.toggleCardButton, css.attr.manageButton),
        );
        controls.appendChild(disableBtn);

        const deleteBtn = makeButton(
            makeItDanger, 
            withText('Удалить'),
            withClickHandler(event => deleteServiceGroup(event, groupId, serviceGroups)),
            withAttributes(css.attr.deleteCardButton, css.attr.manageButton),
        );
        controls.appendChild(deleteBtn);

        return controls;
    }

    function toggleGroupDisabled(event, group, serviceGroups) {
        event.stopPropagation();
        group.disabled = !group.disabled;
        event.target.textContent = group.disabled ? 'Включить' : 'Отключить';
        
        const card = event.target.closest('.card');
        card.classList.toggle(css.custom.disabledGroup, group.disabled);
        card.querySelector('.btn-link').classList.toggle(css.bs.disabled, group.disabled);
        card.querySelector('.btn-link').style.pointerEvents = group.disabled ? 'none' : '';
        
        updateGroupSelect(document.querySelector('.services-controls select'), serviceGroups);
    }

    function deleteServiceGroup(event, groupId, serviceGroups) {
        event.stopPropagation();
        const groupIndex = serviceGroups.selected.indexOf(groupId);
        if (groupIndex !== -1) serviceGroups.selected.splice(groupIndex, 1);
        
        const container = event.target.closest('.services-content');
        renderServicesContent(serviceGroups, container);
        updateGroupSelect(document.querySelector('.services-controls select'), serviceGroups);
    }

    function renderServiceGroup(group, groupId, openStates, serviceGroups) {
        const content = Div(makeItFlexColumn, makeItGapped);
        group.services.forEach(service => {
            content.appendChild(createServiceItem(service));
        });

        return createAccordionItem({
            id: `serviceGroup${groupId}`,
            title: group.name,
            content: content,
            isOpen: openStates[`serviceGroup${groupId}`],
            controls: createServiceGroupControls(group, groupId, serviceGroups),
            additionalClasses: [
                group.disabled ? css.custom.disabledGroup : ''
            ],
            additionalAttributes: [css.attr.innerHeader]
        });
    }

    function renderServicesContent(serviceGroups, container) {
        const openStates = getOpenStates(container);
        container.innerHTML = '';
        
        serviceGroups.selected.forEach(groupId => {
            const group = serviceGroups.available[groupId];
            if (group) {
                container.appendChild(renderServiceGroup(group, groupId, openStates, serviceGroups));
            }
        });
    }

    function renderServicesSection(serviceGroups, container) {
        const card = createAccordionItem({
            id: 'servicesPanel',
            title: 'Сервисы',
            content: (() => {
                const body = Div(makeItFlexColumn, makeItGapped);
                const controlsContainer = Div(withCss(css.custom.servicesControls));

                const groupSelect = Select(withCss(css.bs.formControl));
                updateGroupSelect(groupSelect, serviceGroups);

                const addGroupButton = makeButton(
                    withCss(css.bs.btn, css.bs.btnPrimary),
                    withText('Добавить группу'),
                    withClickHandler(() => {
                        const selectedGroup = groupSelect.value;
                        if (selectedGroup && !serviceGroups.selected.includes(selectedGroup)) {
                            serviceGroups.selected.push(selectedGroup);
                            renderServicesContent(serviceGroups, document.querySelector('.services-content'));
                            updateGroupSelect(groupSelect, serviceGroups);
                        }
                    }),
                    withAttributes(css.attr.addCardButton, css.attr.manageButton)
                );

                controlsContainer.appendChild(groupSelect);
                controlsContainer.appendChild(addGroupButton);
                body.appendChild(controlsContainer);

                const servicesContainer = Div(makeItFlexColumn, makeItGapped,
                    withCss(css.custom.flexContainer, 'services-content')
                );
                body.appendChild(servicesContainer);

                renderServicesContent(serviceGroups, servicesContainer);
                return body;
            })(),
            additionalAttributes: [css.attr.servicesHeader]
        });
        container.appendChild(card);
    }

    // UTILS
    function getOpenStates(container) {
        const states = {};
        (container || document).querySelectorAll('.collapse').forEach(collapse => {
            states[collapse.id] = collapse.classList.contains('show');
        });
        return states;
    }

    function updateGroupSelect(selectElement, serviceGroups) {
        selectElement.innerHTML = '';
        
        const defaultOption = document.createElement('option');
        defaultOption.value = '';
        defaultOption.textContent = 'Выберите группу';
        defaultOption.disabled = true;
        defaultOption.selected = true;
        selectElement.appendChild(defaultOption);
        
        Object.keys(serviceGroups.available).forEach(groupId => {
            if (!serviceGroups.selected.includes(groupId) && !serviceGroups.available[groupId].disabled) {
                const option = document.createElement('option');
                option.value = groupId;
                option.textContent = serviceGroups.available[groupId].name;
                selectElement.appendChild(option);
            }
        });
    }

    // MAIN
    function initAccordion() {
        const accordionContainer = document.getElementById('accordion');
        accordionContainer.innerHTML = '';
        accordionContainer.classList.add(css.custom.accordion, css.custom.mainMargin);
        
        renderFormSection(data.form, accordionContainer);
        renderFieldsSection(data.fields, accordionContainer);
        renderServicesSection(data.service_groups, accordionContainer);
    }
</script>

<style FIX_BOOTSRTAP_TRASH>
    label, .form-group {
        margin: 0 !important;
    }
</style>

<style DECORATIONS>
    :root {
        --red: hsla(0, 87%, 75%, 1);
        --red-hover: hsla(0, 87%, 72%, 1);
        
        --l-blue: hsla(200, 60%, 75%, 1);
        --d-blue: hsla(200, 60%, 60%, 1);
        --d-blue-hover: hsla(200, 65%, 55%, 1);
        
        --yellow: hsla(50, 82%, 63%, 1);
        --yellow-hover: hsla(50, 82%, 60%, 1);
        
        --gray: #ececec;

        --transition-time: var(--transition-time);
    }
</style>

<style HEADERS>
    div.card[data-form-header] {
        background: var(--red);
    }
    div.card[data-fields-header] {
        background: var(--l-blue);
    }
    div.card[data-services-header] {
        background: var(--yellow);
    }
    div.card[data-inner-header] {
        background: #fffa;
    }
</style>

<style BUTTONS>
    .btn {
        border-radius: 12px;
    }

    .btn-primary,
    .btnDanger,
    .btnWarning,
    button[data-manage-button] { 
        border: none !important; 
        outline: none !important;
        box-shadow: none !important;
    }

    button[data-add-card-button]:active,
    button[data-add-card-button]:focus,
    button[data-add-card-button] {
        background: var(--d-blue) !important;
        transition: background-color var(--transition-time);
    }

    button[data-add-card-button]:hover {
        background: var(--d-blue-hover) !important;
    }
    
    button[data-toggle-card-button]:active,
    button[data-toggle-card-button]:focus,
    button[data-toggle-card-button] {
        background: var(--yellow) !important;
        transition: background-color var(--transition-time);
    }

    button[data-toggle-card-button]:hover {
        background: var(--yellow-hover) !important;
    }

    button[data-delete-card-button]:active,
    button[data-delete-card-button]:focus,
    button[data-delete-card-button] {
        background: var(--red) !important;
        transition: background-color var(--transition-time);
    }

    button[data-delete-card-button]:hover {
        background: var(--red-hover) !important;
    }

    button[data-header-toggler]:active,
    button[data-header-toggler] {
        background-color: transparent;
        border: none !important;
        outline: none !important;
        color: black !important;
    }
</style>

<style ACCORDION>
    .card-header { /* Делаем панель в размер тыкабельной кнопки*/
        padding: 0 !important;
        border: none !important; /*Убираем мерзкую нижнюю полоску*/
    }

    #accordion.accordion { /* Расстояние между главными панелями аккордеона*/
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    #accordion .card { /* Скругляем все хедеры панелей */
        border-radius: 12px !important;
    }

    .card-body { /* Определяем покрас панели как полупрозрачный белый */
        background: #fff4 !important;
        padding: 6px !important
    }

    .card { /* Убираем обводку карточки */
        border: 0px !important;
    } 
</style>

<style OTHER>

        width: 100%;
        min-width: 100%;
        max-width: 100%;
    }

    .service-available {
        color: green;
    }

    .service-unavailable {
        color: gray;
    }

    .services-controls {
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .form-control select,
    .services-controls select {
        flex-grow: 1;
        max-width: 300px;
        border-radius: 12px;
    }
    
    .field-controls,
    .group-controls {
        display: flex;
        gap: 5px;
        padding: 10px;
    }
    .disabled-field,
    .disabled-group {
        opacity: 0.6;
    }
    .main-margin {
        margin-top: 5%;
        margin-bottom: 20%;
    }

    .accordion > .card:last-child {
        margin-bottom: 0;
    }
</style>
