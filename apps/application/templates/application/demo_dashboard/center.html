{% load static %}

<div id="center-content"></div>

<script type="module">
  await import("{% static 'deps/make/make.js' %}");

  const csrf = make.other.getCookie('csrftoken')

  const buildProxyTab = (await import("{% static 'deps/js/dashboard/proxy.js' %}")).default;
  const buildAdminTab = (await import("{% static 'deps/js/dashboard/admin.js' %}")).default;
  const buildModerTab = (await import("{% static 'deps/js/dashboard/moder.js' %}")).default;
  const buildUserTab = (await import("{% static 'deps/js/dashboard/user.js' %}")).default;
  
  const qBase = make.Query('/api').via({'X-CSRFToken': csrf});
  const qUsers = qBase.view().at('users').view();
  const qRoles = qBase.view().at('roles').view()
  const qCurrentUser = qBase.view().at('me').view();
  const qCurrentUserRole = qBase.view().at('my-role').view();

  const status = await qCurrentUserRole.get()
  const roles = await qRoles.get()
  const currentUser = await qCurrentUser.get()

  document.getElementById('center-content').appendChild(
    make.Div(
      (() => {
        if (!status.verified) return make.h1(
          "Перед началом работы верифицируйте аккаунт у администратора отдела или в отделе программирования.");
        
        const tabs = make.Tabs()
          .menu(
            make.it.flexRow,
            make.it.gap10px,
            make.it.littleDarker,
            make.style.rounded(12),
            make.style.padding(8),
          );

        const has = (p) => Array.isArray(status.permissions) ? status.permissions.includes(p) : (p in status.permissions);

        if (has('user'))
          tabs.tab()
            .header(...getHeaderComponent("Создать заявку"))
            .content(
              ...buildUserTab(make)
            );

        if (has('moderator'))
          tabs.tab()
            .header(...getHeaderComponent("Входящие заявки"))
            .content(
              ...buildModerTab(make)
            );

        if (has('admin'))
          tabs.tab()
            .header(...getHeaderComponent("Управление отделом"))
            .content(
              ...buildAdminTab(make)
            );
        return tabs;
      })()
    ).build()
  );

  function getHeaderComponent(text) {
    return [
      make.style.rounded(12),
      make.style.padding(8),
      make.it.littleDarker,
      make.it.centered,
      make.it.textCentered,
      make.it.flex,
      make.Paragraph(text)
    ]
  }
</script>
