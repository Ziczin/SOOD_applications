<div id="center-content"></div>


<script type="module">
  const BASE = '/api';
  const JSON_HEADERS = { 'Content-Type': 'application/json' };

  async function fetchReq(url, opts = {}) {
    opts.headers = { ...(opts.headers || {}), ...JSON_HEADERS };
    const res = await fetch(url, opts);
    const text = await res.text();
    try { return JSON.parse(text); } catch { return text; }
  }

  async function get(url) { return fetchReq(url, { method: 'GET' }); }
  async function post(url, body) { return fetchReq(url, { method: 'POST', body: JSON.stringify(body) }); }
  async function put(url, body) { return fetchReq(url, { method: 'PUT', body: JSON.stringify(body) }); }
  async function patch(url, body) { return fetchReq(url, { method: 'PATCH', body: JSON.stringify(body) }); }
  async function del(url) { return fetchReq(url, { method: 'DELETE' }); }

  async function createEnumTag(name) { return post(`${BASE}/enum-tags/`, { name }); }
  async function addEnumToTag(tagId, value) { return post(`${BASE}/enum-tags/${tagId}/items/`, { value }); }
  async function listAvailableTags() { return get(`${BASE}/enum-tags/`); }
  async function listItemsInTag(tagId) { return get(`${BASE}/enum-tags/${tagId}/items/`); }

  async function run() {
    const tag1 = await createEnumTag('Термопринтеры');
    await addEnumToTag(tag1.id, 'Xprinter-420');
    await addEnumToTag(tag1.id, 'Xprinter-325');

    const tag2 = await createEnumTag('Сканеры');
    await addEnumToTag(tag2.id, 'Samsung-xb');
    await addEnumToTag(tag2.id, 'Kyocera-xb12-25');

    const tag3 = await createEnumTag('Принтеры');
    await addEnumToTag(tag3.id, 'Samsung-bprint');
    await addEnumToTag(tag3.id, 'Kyocera-k16');

    const availableNet = await listAvailableTags();
    console.log(availableNet);

    const availableProg = await listAvailableTags();
    console.log(availableProg);

    const printersItems = await listItemsInTag(tag3.id);
    console.log(printersItems);
  }
  window.runTestEnumsRouters = run

</script>
