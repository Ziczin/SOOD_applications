{% load static %}
{{ form_data|json_script:"form-data" }}
{{ errors|json_script:"errors-data" }}

<!DOCTYPE html>
<html lang="en">
<head>
  {% csrf_token %}
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="{% static 'deps/make/make.css' %}">
  <link rel="stylesheet" href="{% static 'deps/css/bright.css' %}">

  <title>Сервис заявок</title>
</head>

<body>
  <div class='container p-1p content w-40p' id="form-template">
  </div>
</body>
</html>

<script type="module">
  await import("{% static 'deps/make/make.js' %}");
  const maindiv = document.getElementById('form-template');
  let content;
  let accordion;

  const innerMakeTemplate = make.Div(
    accordion = make.Accordion(
      make.Preferences({
        isMulti: false
      }),
      make.Card("Заголовок 1",
        make.CardContent(
          make.Paragraph("Содержимое первой карточки"),
          make.Div(
            make.Input(
              make.with.attr({
                type: 'text',
                placeholder: 'inp'
              })
            )
          )
        )
      ),
      make.Card("Заголовок 2",
        make.CardContent(
          content = make.Div(
            make.it.flexColumn, make.it.leftAlign,
            make.style.padding(12),
            make.Paragraph("test1", make.it.delayedMarginOnHover),
            make.Paragraph("test2", make.it.delayedMarginOnHover),
            make.Paragraph("test3", make.it.delayedMarginOnHover)
          ),
          make.Button(
            make.color.dred,
            make.with.text("Добавить"),
            make.on.click(() => content.addChild(
              make.Paragraph("test_new", make.it.delayedMarginOnHover)
            ))
          )
        )
      ),
      make.Card("Заголовок 3",
        make.CardContent(
          make.Div(
            make.style.padding(16),
            make.Accordion(
              make.Preferences({
                isMulti: true
              }),
              make.Card('Подзаголовок 1',
                make.CardContent(
                  make.Paragraph("test 4"),
                  make.Paragraph("test 4"),
                  make.Paragraph("test 4")
                )
              ),
              make.Card('Подзаголовок 2',
                make.CardContent(
                  make.Paragraph("test 5"),
                  make.Paragraph("test 5"),
                  make.Paragraph("test 5")
                )
              ),
              make.Card('Подзаголовок 3',
                make.CardContent(
                  make.Paragraph("test 6"),
                  make.Paragraph("test 6"),
                  make.Paragraph("test 65")
                )
              )
            )
          )
        )
      )
    ),
    make.Button(
      make.with.text('add'),
      make.color.blue,
      make.on.click(() => {
        console.log('123');
        accordion.addChild(
          make.Card("Заголовок новый",
            make.CardContent(
              make.Div(
                make.Paragraph("test1"),
                make.Paragraph("test2"),
                make.Paragraph("test3")
              )
            )
          )
        )
      })
    )
  );

  maindiv.appendChild(innerMakeTemplate.build());
</script>
