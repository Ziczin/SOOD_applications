{% load static %}

{{ form_data|json_script:"form-data" }}
{{ errors|json_script:"errors-data" }}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="{% static 'deps/make/make.css' %}">
  <link rel="stylesheet" href="{% static 'deps/css/bright.css' %}">

  <title>Сервис заявок</title>
</head>

<body>
  <div class='container p-1p' id="form-template">
  </div>
</body>
</html>

<script type="module">
  await import("{% static 'deps/make/make.js' %}");
  let inp1
  let inp2
  let inp3
  let TO = make.on.inputTimeOut(
    3000, () => {
      inp1.swap(inp2)
      make.Notice(500, 2500, 500,
        make.Div(
          make.it.content,
          make.Paragraph('Отработано!!!')
        ),
        inp3 = make.Button(
          make.with.text("TEST"),
          make.it.redir,
          make.on.click(() => {
            inp1.swap(inp3)
          })
        )
      )
    }
  )
  document.getElementById('form-template').appendChild(
    make.Div(
      make.it.content,
      make.it.flexRow,
      make.style.width('80%'),
      make.style.gap(12),
      inp1 = make.Input(
        make.with.attr({placeholder: 'Сюда писать буквы'}),
        TO
      ),
      inp2 = make.Input(
        make.with.attr({placeholder: 'Сюда писать буквы'}),
        TO
      ),
    ).build()
  )
</script>
