{% load static %}
{% load js_loader %}

{{ form_data|json_script:"form-data" }}
{{ errors|json_script:"errors-data" }}

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'deps/js/make/make.css' %}">
  <link rel="stylesheet" href="{% static 'deps/css/bright.css' %}">
  <title>Сервис заявок</title>
</head>
<body>
  <div class='container p-1p content w-40p' id="form-template"></div>
  
  <script type="module">
    window.make_url = "{% static 'deps/make/' %}"
    window.prefab_url = "{% static 'deps/js/prefabs/' %}"
    await import("{% js_file 'make/make.js' %}");

    const makeIt = make.it
    const Paragraph = make.Paragraph
    const With = make.with

    const imp = (await import("{% js_file 'prefabs/import.js' %}")).default(make)
    const csrfObj = await make.Query('/api/csrf-token').get()
    const data = JSON.parse(document.getElementById("form-data").textContent);
    const errors = JSON.parse(document.getElementById("errors-data").textContent);
    const paragraphNotice = await imp("{% js_file 'prefabs/paragraph_notice.js' %}")
    const nextUrlParam = new URLSearchParams(window.location.search).get('next')
    
    const title = make.Div(
      makeIt.flexRow,
      makeIt.centered,
      make.style.gap(10),
      make.h1(data.title),
    );
    
    const fields = make.Form(
      makeIt.flexColumn,
      makeIt.gap10px,
      With.attr({
        method: 'post',
        action: data.action,
      }),
      ...make.callif(nextUrlParam, () => make.Input(
        With.attr({
          type: 'hidden',
          value: nextUrlParam,
          name: 'next'
        })
      )),
      With.csrf(csrfObj.csrfToken),
      ...data.fields.map(el =>
        make.Div(
          makeIt.flexColumn,
          ...(el.type === 'enum' ? [] : [makeIt.delayedMarginOnHover]),
          make.Paragraph(el.label, makeIt.subtitleText, With.style({textAlign: 'left'})),
          el.type !== 'enum' ?
          make.Input(
            make.style.padding(6),
            With.attr({
              id: el.id,
              name: el.id,
              type: el.type,
              placeholder: el.placeholder
            }),
            With.attrs(...el.attrs)) :
            make.Select(
              With.attr({ name: el.id, id: el.id }),
              With.attrs(...el.attrs),
              make.OptionPlaceholder(el.placeholder),
              ...el.enum.map(elEnum =>
                make.Option(elEnum.text, elEnum.value)
            )
          )
        )
      ),
      make.Button(
        makeIt.onConfirmationMargin,
        makeIt.primary,
        With.text(data.btn_confirm),
        With.attr({type: 'submit'})
      )
    );
    
    const bottomStuff = make.Div(
      make.Separator(),
      make.Link(
        makeIt.simpleLink,
        With.text(data.sub_btn_link_text),
        With.attr({ href: data.sub_btn_link }),
      ),
      make.Separator(),
      make.Div(
        makeIt.flexColumn,
        makeIt.gap6px,
        ...data._errors.map(err =>
          make.Paragraph(
            makeIt.delayedMarginOnHover,
            makeIt.leftAlign,
            makeIt.textItalic,
            make.color.error,
            With.text(err.text),
            With.attr({ description: err.desc }),
            make.on.click(async e => {
              const el = e.target;
              const desc = el.getAttribute('description');
              if (!desc) return;
              const isToggled = el.dataset.toggled === 'true';
              const targetText = isToggled ? el.dataset.orig : desc;
              const isInAction = el.dataset.isInAction === 'true';
              if (!isInAction) {
                el.dataset.isInAction = 'true';
                if (!isToggled) {
                  el.dataset.orig = el.textContent;
                  el.dataset.toggled = 'true';
                } else {
                  el.dataset.toggled = 'false';
                }
                while (el.textContent) {
                  el.textContent = el.textContent.slice(0, -1);
                  await new Promise(r => setTimeout(r, 5));
                }
                for (let ch of targetText) {
                  el.textContent += ch;
                  await new Promise(r => setTimeout(r, 15));
                }
                el.dataset.isInAction = 'false';
              }
            })
          )
        )
      )
    );
    
    const container = document.getElementById("form-template");
    container.appendChild(title.build());
    container.appendChild(fields.build());
    container.appendChild(bottomStuff.build());
    
    const formEl = container.querySelector('form');
    
    formEl.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      
      if (data.name === "Registration") {
        const formDataCheck = new FormData(formEl);
        const p1 = formDataCheck.get('password1') || formDataCheck.get('password') || '';
        const p2 = formDataCheck.get('password2') || '';
        if ((p1 && p1.length < 8) || (p2 && p2.length < 8)) {
          paragraphNotice("Пароль и его повтор должны содержать не менее 8 символов.", make.color.error, 2500);
          return;
        }
      }
      
      const formData = new FormData(formEl);
      const url = formEl.getAttribute('action') || window.location.href;
      const resp = await fetch(url, {
        method: 'POST',
        body: formData,
        headers: { "X-CSRFToken": csrfObj.csrfToken },
        credentials: 'same-origin'
      });
      
      if (resp.status === 400) {
        let text = "Ошибка";
        try {
          const j = await resp.json();
          const firstKey = Object.keys(j)[0];
          const val = j[firstKey];
          if (Array.isArray(val) && val.length) {
            text = String(val[0]);
          } else if (typeof val === 'string') {
            text = val;
          } else {
            text = JSON.stringify(j);
          }
          if (text.trim() === "A user with that username already exists.") {
            text = "Пользователь с таким логином уже существует.";
          }
        } catch (e) {}
        paragraphNotice(text, make.color.error, 2500);
        return;
      }
      
      if (resp.redirected) {
        window.location.href = resp.url;
        return;
      }
      
      if (resp.status === 302 || resp.status === 303) {
        const loc = resp.headers.get('Location') || '/applications/dashboard/';
        window.location.href = loc;
        return;
      }
      
      if (resp.status >= 200 && resp.status < 300) {
        try {
          const j = await resp.json();
          if (j && j.next) {
            window.location.href = j.next;
            return;
          }
        } catch (e) {}
        window.location.href = '/applications/dashboard/';
        return;
      }
      
      const bodyText = await resp.text();
      paragraphNotice(bodyText, make.color.error, 2500);
    });
  </script>
</body>
</html>
