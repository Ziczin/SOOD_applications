<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container">
        <h1>Регистрация</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" name="username" id="username" required>
                <span class="error">{{ form.username.errors }}</span>
            </div>
            <div class="form-group">
                <label for="password1">Пароль</label>
                <input type="password" name="password1" id="password1" required>
                <span class="error">{{ form.password1.errors }}</span>
            </div>
            <div class="form-group">
                <label for="password2">Подтверждение пароля</label>
                <input type="password" name="password2" id="password2" required>
                <span class="error">{{ form.password2.errors }}</span>
            </div>
            <div class="form-group">
                <label for="department">Отдел</label>
                <input type="text" name="department" id="department" required>
                <span class="error">{{ form.department.errors }}</span>
            </div>
            <div class="form-group">
                <label for="full_name">Полное имя</label>
                <input type="text" name="full_name" id="full_name" required>
                <span class="error">{{ form.full_name.errors }}</span>
            </div>
            <button type="submit" class="confirm">Зарегистрироваться</button>
        </form>
        <button type="submit" class="redir m-t-10px"
        onclick="location.href='{% url 'login' %}'">Уже есть аккаунт? Войти</button>
    </div>
</body>
</html>
