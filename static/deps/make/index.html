<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ElementBuilder Demo</title>
</head>
<body>
  <script type="module">
    import { DivBuilder, PBuilder } from './Elements.js';

    // Создаём дерево: div → div → p
    const tree = new DivBuilder()
      .addChild(
        new DivBuilder()
          .addChild(
            new PBuilder({ class: 'text' }, 'Привет!')
          )
      );

    // Рекурсивно строим и вставляем в документ
    document.body.append(tree.build());
  </script>
</body>
</html>
